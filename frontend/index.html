<body>

    <h1>Minesweeper</h1>
    <form id="setupForm">
	    <label for ="mineCount">Number of mines:</label>
	    <input type="number" id="mineCount" min="10" max="20" required>
	    <button type="submit">Start</button>
    </form>
    <form id="aiMode">
        <label for ="aiDifficulty">AI Difficulty:</label>
        <select name ="difficulty" id="aiDifficulty">
            <option value="off">Off</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        <label for="interactiveMode">
            <input type="checkbox" id="interactiveMode">
            Interactive Mode
        </label>
    </form>
    <p id="minesRemaining">Remaining flags: </p>
    <p id="timer">Time: 0s</p>
    <p id="turnDisplay" style="display: none">Player's Turn</p>

    <!-- Stores Game -->
    <div id="boardDiv"></div>
</body>

<script>
function playclicksound() {
	document.getElementById("click_sound").play();
}

var cur_state;
var ai_enabled = false;
var interactiveMode = false;
var isAiTurn = false;
//Timer stuff
var timerInterval = null;
var startTime = null;
var gameID = 0; // bumped on every new game so stale responses can be ignored

const colors = [
    null,
    "blue",
    "green",
    "red",
    "darkblue",
    "darkred",
    "darkcyan",
    "black",
    "grey"
];

//Function to update the mine count text
function updateMineCount(count) {
  document.getElementById("minesRemaining").textContent = `Remaining flags: ${count}`;
}

//Gets the new current time
function updateTimerDisplay(){
    const seconds = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById("timer").textContent = `Time: ${seconds}s`;
}

//starts the timer if it hasn't been started, offset by the server's elapsed time
function startTimer(serverElapsed = 0){
    if (timerInterval !== null){
        return;
    }
    startTime = Date.now() - serverElapsed * 1000;
    updateTimerDisplay();
    timerInterval = setInterval(updateTimerDisplay, 1000);
}

//stops the timer when called
function stopTimer(serverElapsed){
    if(timerInterval !== null){
        clearInterval(timerInterval);
        timerInterval = null;
    }
    if(typeof serverElapsed === "number"){
        document.getElementById("timer").textContent = `Time: ${Math.floor(serverElapsed)}s`;
    } else if (startTime !== null){
        updateTimerDisplay();
    }
}

//resets the timer
function resetTimer(){
    stopTimer();
    startTime = null;
    document.getElementById("timer").textContent = 'Time: 0s';
}

// Trey - 09/18/26
// function that is performed upon left click, it takes the x and y coordinates of the cell clicked
// and calls the /board endpoint with the information
function cellClicked(x, y){
	console.log(`clicked ${x}, ${y}`);
	
	if (cur_state != 2 || (aiEnabled && !interactiveMode) || (aiEnabled && isAiTurn)){
        	return;
	}
    
    const myGame = gameId; // remember which game this click belongs to

	// create the post request to the /board endpoint
	fetch("/board", {
		method: "POST",
		headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify({
			x: x,
			y: y
		})
	})
		.then(response => {
			if (!response.ok) throw new Error(`/board returned ${response.status}`);
			return response.json(); // recieve the json response
		})
		.then(data => {
            if(myGame != gameID) return;
			console.log(data);
			populateTable(data.board); // take the given board data and pass it to populateTable
			cur_state = data.result; // assigns the result of the game to cur_state
            startTimer(data.elapsed);
            updateTurnDisplay(data.turn);
            isAiTurn = (data.turn === "ai");
			if (cur_state == 1) { // if it is 1
                stopTimer(data.elapsed); //stops the timer when the game ends
				showWinScreen(); // then the game is won, display corresponding screen
			}
			else if (cur_state == 0) { // if it is 0
                stopTimer(data.elapsed); //stops the timer when the game ends
				showLossScreen(); // then the is lost, display corresponding screen
			}else if(aiEnabled && isAiTurn){
                if(interactiveMode){

                }else{
                    setTimeout(triggerAiTurn, 500)
                }
            }
		})
        .catch(err => {
			console.error(err);
			if (myGame === gameId) stopTimer(); // don't leave a timer running on a failed request;
        });
}

// Trey - 09/18/26
// function that is performed upon a right click, it takes the x and y coordinates of the cell
// clicked and passes information over to the /flag endpoint so it can handle flagging functionality
function cellFlagged(x, y){
    console.log(`flagged ${x}, ${y}`);
    if (cur_state != 2 || (aiEnabled && isAiTurn)){
        return;
    }
	// create the post request to the /flag endpoint
	fetch("/flag", {
		method: "POST",
		headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify({
			x: x,
			y: y
		})
	})
		.then(response => { // recieve the json response and determine if a 404 error occured
            if (response.status == 404){
                throw new Error ("Board Not Created")
            }
            else{
                return response.json()
            }
            })
		.then(data => { 
      populateTable(data.board); // takes the given board data and populates the table with it
      updateMineCount(data.mines); // takes the given mine data and updates the mine count with it
      updateTurnDisplay(data.turn);
      isAiTurn = (data.turn === "ai");
      if(aiEnabled && isAiTurn){
        if(interactiveMode){

        }else{
            setTimeout(triggerAiTurn, 500)
        }
      }
    }).catch(error => {console.log(error)});
}

function triggerAiTurn(){
    if (cur_state != 2){
        return;
    }
    fetch("/ai-turn", {
        method: "POST",
        headers: {"Content-Type": "application/json"}
    })
    .then(response => response.json())
    .then(data => {
        populateTable(data.board);
        cur_state = data.result;
        updateMineCount(data.mines);
        updateTurnDisplay(data.turn);
        isAiTurn = (data.turn === "ai");
        if (cur_state == 1){
            stopTimer(data.elapsed);
            showWinScreen();
        }else if(cur_state == 0){
            stopTimer(data.elapsed);
            showLossScreen();
        }else if(aiEnabled && isAiTurn && !interactiveMode){
            setTimeout(triggerAiTurn, 500);
        }
    });
}

// Jack Larson
// 9/17/26
// Displays a text over the game stating a win.
function showWinScreen() {
    //create text element
    const winText = document.createElement("p");

    //style to win end text
    winText.className = "endGameText winText";

    //fill text
    winText.textContent = "YOU WIN";
    
    //add to game screen
    const boardDiv = document.getElementById("boardDiv");
    boardDiv.appendChild(winText);
}

// Jack Larson
// 9/17/26
// Displays a text over the game stating a loss.
function showLossScreen() {
    //create text element
    const lossText = document.createElement("p");
    
    //style to loss end text
    lossText.className = "endGameText lossText";
    
    //fill text
    lossText.textContent = "YOU LOSE";
    
    //add to game screen
    const boardDiv = document.getElementById("boardDiv");
    boardDiv.appendChild(lossText);
}

// Jack Larson
// 9/17/26
// Takes in a 2D array of integers and populates the table.
function populateTable(data) {
    //loop through rows
    for (let x = 0; x < 10; x++){

        //split data to row
        const row = data[x];

        //loop through columns
        for (let y = 0; y < 10; y++){

            //split row to cell value
            const cell = row[y];

            //find the given cell by position
            const boardCell = document.querySelector(`[position="${x}, ${y}"]`);
            
            //fill in text by default
            boardCell.textContent = cell;

            //classify it for styling as a revealed square
            boardCell.classList = `boardCell`;


            //based on special cell values
            switch (cell){
                case 0:
                    //empty on zero
                    boardCell.textContent = "";
                    break;
                case -1:
                    //flag on -1
                    boardCell.textContent = "🚩";
                    boardCell.classList = "boardCell boardCellUnseen";
                    break;
                case null:
                    boardCell.textContent = "";
                    boardCell.classList = "boardCell boardCellUnseen";
                    break;
                case -2:
                    //explosion on -2 (clicked mine)
                    boardCell.textContent = "💥";
                    break;
                    
                case -3:
                    //bomb on -3 (unclicked mine revealed on failure)
                    boardCell.textContent = "💣";
                    break;
                default:
                    boardCell.style.color = colors[cell];
                    break;
            }
        }
    }
}

// Jack Larson
// 9/17/26
// Generates elements of a table and adds it to the document.
function generateTable() {
    //find board container
    const boardDiv = document.getElementById("boardDiv");

    //create table
    const boardTable = document.createElement("table");

    //style
    boardTable.classList = "boardTable";

    //add header for column labels
    const headerRow = document.createElement("tr");
    headerRow.innerHTML = '<th></th>';

    //Iterate for each letter and add to top row
    for (let i = 0; i < 10; i++){
        headerRow.innerHTML += `<th class = 'headerCell'>${String.fromCharCode(65+i)}</th>`
    }
    boardTable.appendChild(headerRow);
    //loop through rows
    for (let x = 0; x < 10; x++){
        //create table row
        const boardRow = document.createElement("tr");
        //style
        boardRow.classList = "boardRow";

        //add row label
        const rowHeader = document.createElement("td");
        rowHeader.classList = "headerCell";
        rowHeader.innerText = x;
        boardRow.appendChild(rowHeader);
        
        //loop through columns
        for (let y = 0; y < 10; y++){
            //create cell
            const boardCell = document.createElement("td");
            //style
            boardCell.classList = "boardCell boardCellUnseen";
            //add attribute for finding by position and sending position for clicks
            boardCell.setAttribute("position", `${x}, ${y}`);
            
            //add listener for left click and call function with given position
            boardCell.addEventListener("click", (event) =>{
                if(aiEnabled && !interactiveMode){
                    return;
                }
                if(aiEnabled && isAiTurn && interactiveMode){
                    triggerAiTurn();
                }else{
                    cellClicked(x, y);
                }
            });
            //add listener for right click and call function with given position
            boardCell.addEventListener("contextmenu", (event) =>{
                //cancel opening context menu on right click
                event.preventDefault();
                cellFlagged(x, y);
            });

            //add cell to row
            boardRow.appendChild(boardCell);
        }

        //add row to table
        boardTable.appendChild(boardRow);
    }

    //add board to screen
    boardDiv.replaceChildren(boardTable);
}

// add an event listener to the setupForm button that prevents the usual submit event
// functionality and instead handles mine count and the post request to the /setup endpoint
document.getElementById("setupForm").addEventListener("submit", function(event) {
	console.log("submitting form");
	event.preventDefault();
	
	// sets the number of mines to be in the game board
	const mines = Number(document.getElementById("mineCount").value);
    // sets difficulty
    const difficulty = document.getElementById("aiDifficulty").value;
    interactiveMode = document.getElementById("interactiveMode").checked;
    aiEnabled = (difficulty !== "off");
    isAiTurn = false;

	//Update the mine count once the game is started
	updateMineCount(mines);
    gameID++;
    resetTimer(); //resets the timer on a new game
	//Set the text box to display the correct number of mines
	document.getElementById("minesRemaining").style.display = "block";
	
	// create the post request to the /setup endpoint
	fetch("http://localhost:8000/setup", {
		method: "POST",
		headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify({
			n: mines,
            difficulty: difficulty,
            interactive: interactiveMode
		})
	})
		.then(() => {
            generateTable(); // after setup completes generate a new board for the game
            if(aiEnabled && !interactiveMode){
                isAiTurn = true;
                updateTurnDisplay("ai");
                startTimer();
                setTimeout(triggerAiTurn, 500);
            }else{
                updateTurnDisplay("player");
            }
        });
	document.getElementById("minesRemaining").style.display = "block";
	cur_state = 2;
});

aiDifficulty = document.getElementById("aiDifficulty");
interactive = document.getElementById("interactiveMode");
aiDifficulty.addEventListener("change", function(){
    if(aiDifficulty.value === "off"){
        interactive.checked = false;
        interactive.disabled = true;
    }
    else{
        interactive.disabled = false;
    }
});
function updateTurnDisplay(turn){
    turndisplay = document.getElementById("turnDisplay");
    if(aiDifficulty.value === "off"){
        turndisplay.style.display = "none";
        return;
    }
    turndisplay.style.display = "block";
    if(turn === "player"){
        turndisplay.textContent = "Player's Turn";
    }else if(turn === "ai" && interactive.checked){
        turndisplay.textContent = "AI's Turn (Click to Proceed)";
    }else if(turn === "ai" && !interactive.checked){
        turndisplay.textContent = "AI's Turn"
    }
}
</script>
